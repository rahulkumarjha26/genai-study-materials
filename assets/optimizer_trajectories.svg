<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowSGD" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f85149"/>
    </marker>
    <marker id="arrowMom" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowAdam" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad10)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Optimization Trajectories on Loss Surface</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">SGD (Oscillations) vs. Momentum (Velocity) vs. Adam (Adaptive Steps)</text>

  <!-- Contour Bowls around Global Minimum (540, 240) -->
  <ellipse cx="540" cy="240" rx="200" ry="130" fill="none" stroke="#21262d" stroke-width="1.5"/>
  <ellipse cx="540" cy="240" rx="150" ry="95" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <ellipse cx="540" cy="240" rx="100" ry="60" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <ellipse cx="540" cy="240" rx="50" ry="30" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-width="1.5"/>

  <!-- Global Minimum Star -->
  <circle cx="540" cy="240" r="8" fill="#d29922" stroke="#ffffff" stroke-width="2"/>
  <text x="540" y="244" fill="#0d1117" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" text-anchor="middle">★</text>
  <text x="540" y="275" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Global Minimum</text>

  <!-- Starting Point: (140, 160) -->
  <circle cx="140" cy="160" r="7" fill="#ffffff"/>
  <text x="140" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Start</text>

  <!-- 1. SGD: Jagged Zig-Zag Path (Red) -->
  <path d="M 140 160 L 190 280 L 250 170 L 320 290 L 390 190 L 450 270 L 500 220 L 525 245" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowSGD)"/>

  <!-- 2. Momentum: Smooth Arc carrying forward inertia (Blue) -->
  <path d="M 140 160 Q 260 270, 360 260 T 530 240" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowMom)"/>

  <!-- 3. Adam: Adaptive, Direct, Rapid descent (Green) -->
  <path d="M 140 160 Q 300 200, 532 238" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowAdam)"/>

  <!-- Legend -->
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="200" height="50" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
    <text x="20" y="22" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">1. Standard SGD</text>
    <text x="20" y="38" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Erratic zig-zag across ravines</text>

    <rect x="230" y="0" width="220" height="50" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
    <text x="250" y="22" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">2. SGD with Momentum</text>
    <text x="250" y="38" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Accelerates through consistent paths</text>

    <rect x="480" y="0" width="200" height="50" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
    <text x="500" y="22" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">3. Adam (Industry Default)</text>
    <text x="500" y="38" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Adaptive step sizing per parameter</text>
  </g>
</svg>