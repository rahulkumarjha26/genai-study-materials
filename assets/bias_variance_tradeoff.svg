<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="480" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">The Bias-Variance Tradeoff</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Total Error = Bias² + Variance + Irreducible Error</text>

  <!-- Optimal Sweet Spot Highlight Zone -->
  <rect x="340" y="80" width="120" height="300" fill="url(#optGrad)" rx="6"/>
  <line x1="400" y1="80" x2="400" y2="380" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <!-- Y Axis -->
  <line x1="100" y1="380" x2="100" y2="85" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="50" y="230" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" transform="rotate(-90 50 230)" text-anchor="middle">Prediction Error</text>

  <!-- X Axis -->
  <line x1="100" y1="380" x2="740" y2="380" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="415" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Model Complexity (Degrees of Freedom)</text>

  <!-- Grid lines (subtle) -->
  <line x1="100" y1="310" x2="720" y2="310" stroke="#21262d" stroke-width="1"/>
  <line x1="100" y1="230" x2="720" y2="230" stroke="#21262d" stroke-width="1"/>
  <line x1="100" y1="150" x2="720" y2="150" stroke="#21262d" stroke-width="1"/>

  <!-- Irreducible Error Baseline -->
  <line x1="100" y1="350" x2="720" y2="350" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="710" y="344" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="end">Irreducible Error (Noise σ²)</text>

  <!-- 1. Bias Squared Curve (Starts high, drops smoothly to near 0) -->
  <!-- Path: starts at (120, 110), drops to (700, 340) -->
  <path d="M 120 120 Q 220 320, 400 335 T 700 345" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>

  <!-- 2. Variance Curve (Starts near 0, explodes upward) -->
  <!-- Path: starts at (120, 345), rises to (700, 110) -->
  <path d="M 120 345 Q 400 335, 580 230 T 700 110" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round"/>

  <!-- 3. Training Error Curve (Starts high, asymptotically reaches 0) -->
  <path d="M 120 140 Q 240 330, 400 345 T 700 355" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- 4. Total Test Error (U-Shaped Curve: sum of curves) -->
  <path d="M 120 100 Q 240 230, 400 230 Q 560 230, 700 100" fill="none" stroke="#a371f7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sweet Spot Point on Total Error Curve -->
  <circle cx="400" cy="230" r="6" fill="#3fb950" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Sweet Spot Annotation Badge -->
  <rect x="335" y="155" width="130" height="42" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="400" y="173" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SWEET SPOT</text>
  <text x="400" y="189" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Optimal Generalization</text>
  <line x1="400" y1="197" x2="400" y2="222" stroke="#388bfd" stroke-width="1.5"/>

  <!-- Curve Labels -->
  <text x="135" y="115" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Bias² (Underfitting)</text>
  <text x="685" y="105" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="end">Variance (Overfitting)</text>
  <text x="400" y="270" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Total Test Error (U-Curve)</text>
  <text x="210" y="325" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Training Error</text>

  <!-- Bottom Zones Explanation -->
  <g transform="translate(100, 435)">
    <!-- Zone 1 -->
    <text x="60" y="0" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">HIGH BIAS ZONE</text>
    <text x="60" y="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Model too simple (Underfitting)</text>

    <!-- Zone 2 -->
    <text x="300" y="0" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">OPTIMAL CAPACITY</text>
    <text x="300" y="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Lowest validation error</text>

    <!-- Zone 3 -->
    <text x="540" y="0" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">HIGH VARIANCE ZONE</text>
    <text x="540" y="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Memorized noise (Overfitting)</text>
  </g>
</svg>