<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="marginBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad4)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Support Vector Machine (SVM): Maximum Margin Separator</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">Optimal Hyperplane maximizing the geometric margin: Margin Width = 2 / ||w||</text>

  <!-- Margin Gutter Band (Polygon between positive and negative margin) -->
  <polygon points="120,380 180,380 620,100 560,100" fill="url(#marginBand)"/>

  <!-- Lines -->
  <!-- Negative Margin: w^T x + b = -1 -->
  <line x1="140" y1="390" x2="580" y2="90" stroke="#f85149" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="230" y="345" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" transform="rotate(-34 230 345)">Negative Margin: wᵀx + b = -1</text>

  <!-- Optimal Hyperplane: w^T x + b = 0 -->
  <line x1="190" y1="390" x2="630" y2="90" stroke="#58a6ff" stroke-width="3.5"/>
  <text x="310" y="325" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" transform="rotate(-34 310 325)">Optimal Hyperplane: wᵀx + b = 0</text>

  <!-- Positive Margin: w^T x + b = +1 -->
  <line x1="240" y1="390" x2="680" y2="90" stroke="#3fb950" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="390" y="305" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" transform="rotate(-34 390 305)">Positive Margin: wᵀx + b = +1</text>

  <!-- Class +1 Points (Green Circles) -->
  <circle cx="560" cy="180" r="6" fill="#3fb950"/>
  <circle cx="620" cy="220" r="6" fill="#3fb950"/>
  <circle cx="670" cy="180" r="6" fill="#3fb950"/>
  <circle cx="600" cy="140" r="6" fill="#3fb950"/>
  <circle cx="640" cy="280" r="6" fill="#3fb950"/>

  <!-- Support Vector (+1) on gutter: (460, 240) -->
  <circle cx="460" cy="240" r="8" fill="#3fb950" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="535" cy="190" r="8" fill="#3fb950" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Class -1 Points (Red Squares) -->
  <rect x="180" y="270" width="12" height="12" rx="2" fill="#f85149"/>
  <rect x="220" y="310" width="12" height="12" rx="2" fill="#f85149"/>
  <rect x="260" y="340" width="12" height="12" rx="2" fill="#f85149"/>
  <rect x="300" y="280" width="12" height="12" rx="2" fill="#f85149"/>

  <!-- Support Vector (-1) on gutter: (360, 240) -->
  <rect x="354" y="234" width="14" height="14" rx="2" fill="#f85149" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Double-arrow showing Margin Width -->
  <line x1="360" y1="240" x2="460" y2="240" stroke="#d29922" stroke-width="2" marker-start="url(#arrow4)" marker-end="url(#arrow4)"/>
  <rect x="375" y="210" width="70" height="24" rx="4" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="410" y="226" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2 / ||w||</text>

  <!-- Support Vectors Callout -->
  <rect x="490" y="280" width="190" height="50" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="500" y="300" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">SUPPORT VECTORS</text>
  <text x="500" y="316" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">The only critical points defining</text>
  <text x="500" y="328" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">hyperplane position &amp; orientation</text>
</svg>