<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad8)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">The 2x2 Confusion Matrix &amp; Evaluation Metrics</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">Precision vs. Recall vs. Accuracy in Production</text>

  <!-- Top Headers: Predicted Positive / Predicted Negative -->
  <rect x="230" y="85" width="220" height="35" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="107" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PREDICTED POSITIVE (1)</text>

  <rect x="470" y="85" width="220" height="35" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="580" y="107" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PREDICTED NEGATIVE (0)</text>

  <!-- Side Headers: Actual Positive / Actual Negative -->
  <rect x="30" y="130" width="180" height="110" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="180" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ACTUAL POSITIVE</text>
  <text x="120" y="198" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">(True Fraud / Sick)</text>

  <rect x="30" y="250" width="180" height="110" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="120" y="300" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ACTUAL NEGATIVE</text>
  <text x="120" y="318" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">(Legitimate / Healthy)</text>

  <!-- Cell 1: True Positive (Green) -->
  <rect x="230" y="130" width="220" height="110" rx="8" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="2"/>
  <text x="340" y="165" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">TRUE POSITIVE (TP)</text>
  <text x="340" y="188" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">Correctly identified positive</text>
  <text x="340" y="206" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">e.g. Correctly caught fraud</text>

  <!-- Cell 2: False Negative (Red - High Alert!) -->
  <rect x="470" y="130" width="220" height="110" rx="8" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="2"/>
  <text x="580" y="165" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">FALSE NEGATIVE (FN)</text>
  <text x="580" y="188" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Missed positive! (Type II Error)</text>
  <text x="580" y="206" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">e.g. Fraud slipped through!</text>

  <!-- Cell 3: False Positive (Amber - False Alarm) -->
  <rect x="230" y="250" width="220" height="110" rx="8" fill="#d29922" fill-opacity="0.15" stroke="#d29922" stroke-width="2"/>
  <text x="340" y="285" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">FALSE POSITIVE (FP)</text>
  <text x="340" y="308" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">False alarm! (Type I Error)</text>
  <text x="340" y="326" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">e.g. Blocked legitimate user</text>

  <!-- Cell 4: True Negative (Blue) -->
  <rect x="470" y="250" width="220" height="110" rx="8" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="2"/>
  <text x="580" y="285" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" text-anchor="middle">TRUE NEGATIVE (TN)</text>
  <text x="580" y="308" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">Correctly ignored negative</text>
  <text x="580" y="326" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">e.g. Normal user allowed</text>

  <!-- Bottom Metric Formulas -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="320" height="46" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
    <text x="160" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PRECISION = TP / (TP + FP)</text>
    <text x="160" y="36" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Priority when False Positives are costly (Spam)</text>

    <rect x="360" y="0" width="320" height="46" rx="6" fill="#238636" stroke="#2ea043" stroke-width="1"/>
    <text x="520" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RECALL = TP / (TP + FN)</text>
    <text x="520" y="36" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Priority when False Negatives are dangerous (Fraud)</text>
  </g>
</svg>