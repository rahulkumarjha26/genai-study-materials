<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowPC1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowPC2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad5)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Principal Component Analysis (PCA): Orthogonal Variance</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">Transforming correlated features into uncorrelated, orthogonal principal components</text>

  <!-- Center of data cloud at (380, 240) -->
  <!-- Correlated Data Points Cloud -->
  <ellipse cx="380" cy="240" rx="200" ry="65" transform="rotate(-35 380 240)" fill="#58a6ff" fill-opacity="0.08" stroke="#30363d" stroke-dasharray="4,4"/>

  <!-- Data points -->
  <circle cx="230" cy="330" r="4.5" fill="#8b949e"/>
  <circle cx="270" cy="310" r="5" fill="#8b949e"/>
  <circle cx="310" cy="270" r="5.5" fill="#8b949e"/>
  <circle cx="340" cy="290" r="5" fill="#8b949e"/>
  <circle cx="380" cy="240" r="6" fill="#ffffff"/>
  <circle cx="410" cy="210" r="5" fill="#8b949e"/>
  <circle cx="440" cy="230" r="5" fill="#8b949e"/>
  <circle cx="470" cy="180" r="5.5" fill="#8b949e"/>
  <circle cx="520" cy="150" r="5" fill="#8b949e"/>
  <circle cx="360" cy="220" r="4.5" fill="#8b949e"/>
  <circle cx="420" cy="260" r="5" fill="#8b949e"/>

  <!-- PC1 Vector (Major Axis - Direction of Maximum Variance) -->
  <line x1="200" y1="365" x2="560" y2="115" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrowPC1)"/>
  <rect x="540" y="80" width="220" height="48" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="650" y="100" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PC1: 1st Principal Component</text>
  <text x="650" y="116" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Captures ~85% of total variance</text>

  <!-- PC2 Vector (Orthogonal at 90 degrees) -->
  <line x1="430" y1="310" x2="330" y2="170" stroke="#3fb950" stroke-width="3.5" marker-end="url(#arrowPC2)"/>
  <rect x="190" y="140" width="200" height="48" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="290" y="160" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PC2: 2nd Component (90°)</text>
  <text x="290" y="176" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Orthogonal: Correlation is 0.0</text>

  <!-- Right Angle Symbol -->
  <path d="M 395 218 L 382 209 L 368 230" fill="none" stroke="#d29922" stroke-width="2"/>

  <!-- Takeaway badge -->
  <rect x="250" y="385" width="300" height="34" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="407" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Key Property: PC1 and PC2 are completely orthogonal (uncorrelated)</text>
</svg>