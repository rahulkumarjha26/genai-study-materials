<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow7" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad7)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">K-Means Clustering &amp; The Elbow Method</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">Minimizing within-cluster sum of squares (WCSS) &amp; choosing optimal K</text>

  <!-- Left: 3 Clusters (x from 60 to 420) -->
  <text x="240" y="95" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3 Converged Centroids (K = 3)</text>

  <!-- Cluster 1 (Blue) -->
  <circle cx="160" cy="180" r="45" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="140" cy="160" r="5" fill="#58a6ff"/>
  <circle cx="180" cy="170" r="5" fill="#58a6ff"/>
  <circle cx="150" cy="200" r="5" fill="#58a6ff"/>
  <!-- Centroid 1 -->
  <line x1="152" y1="172" x2="168" y2="188" stroke="#ffffff" stroke-width="3.5"/>
  <line x1="168" y1="172" x2="152" y2="188" stroke="#ffffff" stroke-width="3.5"/>

  <!-- Cluster 2 (Green) -->
  <circle cx="310" cy="170" r="45" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="290" cy="150" r="5" fill="#3fb950"/>
  <circle cx="330" cy="165" r="5" fill="#3fb950"/>
  <circle cx="305" cy="190" r="5" fill="#3fb950"/>
  <!-- Centroid 2 -->
  <line x1="302" y1="162" x2="318" y2="178" stroke="#ffffff" stroke-width="3.5"/>
  <line x1="318" y1="162" x2="302" y2="178" stroke="#ffffff" stroke-width="3.5"/>

  <!-- Cluster 3 (Coral/Red) -->
  <circle cx="235" cy="290" r="48" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="215" cy="275" r="5" fill="#f85149"/>
  <circle cx="255" cy="285" r="5" fill="#f85149"/>
  <circle cx="230" cy="315" r="5" fill="#f85149"/>
  <!-- Centroid 3 -->
  <line x1="227" y1="282" x2="243" y2="298" stroke="#ffffff" stroke-width="3.5"/>
  <line x1="243" y1="282" x2="227" y2="298" stroke="#ffffff" stroke-width="3.5"/>

  <text x="240" y="375" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">White 'X' markers = Centroid means (μ_k)</text>

  <!-- Divider Line -->
  <line x1="430" y1="80" x2="430" y2="400" stroke="#30363d" stroke-width="1.5"/>

  <!-- Right: The Elbow Curve -->
  <text x="610" y="95" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">The Elbow Method Curve</text>

  <!-- Elbow Axes -->
  <line x1="480" y1="360" x2="480" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="450" y="245" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" transform="rotate(-90 450 245)" text-anchor="middle">Inertia (WCSS)</text>

  <line x1="480" y1="360" x2="740" y2="360" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="610" y="395" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Number of Clusters (K)</text>

  <!-- Elbow Curve line: K=1(510, 150), K=2(560, 210), K=3(610, 290), K=4(660, 315), K=5(710, 330) -->
  <path d="M 510 150 L 560 215 L 610 290 L 660 320 L 710 335" fill="none" stroke="#d29922" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Elbow Point Highlight at K=3 -->
  <circle cx="610" cy="290" r="7" fill="#3fb950" stroke="#ffffff" stroke-width="2"/>

  <!-- Elbow Callout -->
  <rect x="580" y="225" width="130" height="42" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="645" y="243" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ELBOW POINT</text>
  <text x="645" y="258" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Optimal K = 3</text>
  <line x1="610" y1="267" x2="610" y2="283" stroke="#388bfd" stroke-width="1.5"/>

  <!-- Tick marks -->
  <text x="510" y="375" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">1</text>
  <text x="560" y="375" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">2</text>
  <text x="610" y="375" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="660" y="375" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">4</text>
  <text x="710" y="375" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">5</text>
</svg>