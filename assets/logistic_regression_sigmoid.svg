<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bgGrad3)" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Logistic Regression: The Sigmoid Function</text>
  <text x="400" y="60" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">Mapping linear score z into probability P(y=1) bounded in [0, 1]</text>

  <!-- Zones -->
  <rect x="120" y="90" width="280" height="290" fill="#f85149" fill-opacity="0.06"/>
  <rect x="400" y="90" width="280" height="290" fill="#3fb950" fill-opacity="0.06"/>

  <!-- Axes -->
  <line x1="400" y1="380" x2="400" y2="85" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="400" y="75" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Probability P(y=1)</text>

  <line x1="120" y1="360" x2="700" y2="360" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="400" y="415" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Linear Score: z = w · x + b</text>

  <!-- Horizontal Grid / Probability levels -->
  <!-- P = 1.0 at y = 130 -->
  <line x1="120" y1="130" x2="680" y2="130" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="110" y="135" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="end">1.0</text>

  <!-- P = 0.5 at y = 245 -->
  <line x1="120" y1="245" x2="680" y2="245" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="110" y="250" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="end">0.5</text>

  <!-- P = 0.0 at y = 360 -->
  <text x="110" y="365" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="end">0.0</text>

  <!-- Sigmoid S-Curve -->
  <!-- Smooth cubic bezier curve from (140, 355) through (400, 245) to (660, 135) -->
  <path d="M 130 358 C 280 358, 320 340, 400 245 C 480 150, 520 132, 670 132" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Decision Threshold Point -->
  <circle cx="400" cy="245" r="6.5" fill="#d29922" stroke="#ffffff" stroke-width="2"/>

  <!-- Badges -->
  <rect x="420" y="225" width="200" height="42" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="430" y="243" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Decision Threshold: P = 0.5</text>
  <text x="430" y="258" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">z = 0 (Equal odds 50/50)</text>

  <!-- Class 0 and Class 1 Callouts -->
  <rect x="150" y="150" width="160" height="45" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="230" y="169" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PREDICT CLASS 0</text>
  <text x="230" y="184" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">z &lt; 0  (P &lt; 0.5)</text>

  <rect x="490" y="150" width="160" height="45" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="570" y="169" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PREDICT CLASS 1</text>
  <text x="570" y="184" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">z &gt; 0  (P &gt; 0.5)</text>

  <!-- Formula badge -->
  <rect x="250" y="300" width="300" height="34" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="400" y="322" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sigmoid Formula: σ(z) = 1 / (1 + e⁻ᶻ)</text>
</svg>